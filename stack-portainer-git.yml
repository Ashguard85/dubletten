# Vollständiges App-Projekt in GitHub main hochladen, bevor dieser Stack startet.
# In Portainer APP_PASSWORD und bei LAN-Zugriff APP_BIND_IP setzen.
# CRM-Kundendateien gehören NIEMALS in GitHub.
x-app-build: &app-build
  context: https://github.com/Ashguard85/dubletten.git#main
x-app-environment: &app-environment
  APP_TITLE: "CRM Dubletten Lokal"
  DB_PATH: "/app/data/crm.sqlite"
  APP_PASSWORD: "${APP_PASSWORD:?Bitte ein langes APP_PASSWORD in Portainer setzen}"
  OLLAMA_BASE_URL: "http://host.docker.internal:11434"
  OLLAMA_TEXT_MODEL: "qwen3:14b"
  OLLAMA_TIMEOUT_SECONDS: "600"
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
  STREAMLIT_SERVER_MAX_UPLOAD_SIZE: "250"
  STREAMLIT_SERVER_MAX_MESSAGE_SIZE: "300"
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  NO_PROXY: "host.docker.internal,localhost,127.0.0.1"
services:
  app:
    image: crm-dubletten:1.8.7.2-neu
    pull_policy: build
    build: *app-build
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8192}:8501"
    volumes:
      - /home/buebi/docker/crm-dubletten-neu/data:/app/data
      - /home/buebi/docker/crm-dubletten-neu/backups:/app/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment: *app-environment
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 60s
    restart: unless-stopped
