# Lokale Neuinstallation mit docker compose im entpackten Projektordner:
# APP_PASSWORD=... docker compose -f stack-portainer-local.yml up -d --build
# Verzeichnis-Mounts bei anderem Benutzer/Host anpassen.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-dubletten:1.8.5-neu
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8192}:8501"
    environment:
      APP_PASSWORD: "${APP_PASSWORD:?APP_PASSWORD setzen}"
      DB_PATH: "/app/data/crm.sqlite"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_TEXT_MODEL: "qwen3:14b"
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: "250"
      STREAMLIT_SERVER_MAX_MESSAGE_SIZE: "300"
    volumes:
      - /home/buebi/docker/crm-dubletten-neu/data:/app/data
      - /home/buebi/docker/crm-dubletten-neu/backups:/app/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    restart: unless-stopped
